<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2026/8/25 高鐵策略合作記者會 相關新聞彙整</title>
  <style>
    :root {
      /* 淺黃色 / 琥珀暖色系設定 */
      --primary: #854d0e;          /* 標題與重點深棕黃色 */
      --accent: #d97706;           /* 活力琥珀黃 */
      --accent-hover: #b45309;     /* 懸停加深黃 */
      --accent-light: #fef3c7;     /* 媒體標籤淺黃底色 */
      --bg: #fffbeb;               /* 網頁主背景淺米黃 */
      --card-bg: #ffffff;          /* 卡片純白背景 */
      --text-main: #292524;        /* 主文字深灰褐 */
      --text-muted: #78716c;       /* 次要文字 */
      --border: #fde68a;           /* 邊框溫和淺黃 */
      --shadow: 0 4px 6px -1px rgba(180, 83, 9, 0.05), 0 2px 4px -2px rgba(180, 83, 9, 0.03);
      --hover-shadow: 0 12px 20px -3px rgba(180, 83, 9, 0.12), 0 4px 6px -4px rgba(180, 83, 9, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans TC", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      line-height: 1.6;
      padding: 3rem 1rem 4rem;
    }

    .container {
      max-width: 860px;
      margin: 0 auto;
    }

    /* 頂部標題區 */
    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    .badge-date {
      display: inline-block;
      background: #fde68a;
      color: #92400e;
      padding: 0.3rem 0.9rem;
      border-radius: 9999px;
      font-size: 0.875rem;
      font-weight: 600;
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-size: 2.2rem;
      color: var(--primary);
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }

    header p {
      color: var(--text-muted);
      font-size: 1rem;
    }

    /* 新聞卡片列表 */
    .news-list {
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    /* 卡片直接作為超連結 (支援本頁跳轉與上一頁返回) */
    .news-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1.75rem;
      box-shadow: var(--shadow);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      transition: all 0.25s ease;
    }

    .news-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: var(--hover-shadow);
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .media-tag {
      background-color: var(--accent-light);
      color: #92400e;
      font-weight: 600;
      font-size: 0.875rem;
      padding: 0.25rem 0.7rem;
      border-radius: 6px;
    }

    .reporter-name {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .news-title {
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--text-main);
      line-height: 1.5;
      transition: color 0.2s;
    }

    .news-card:hover .news-title {
      color: var(--accent);
    }

    .card-footer {
      font-size: 0.875rem;
      color: var(--accent);
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 0.3rem;
      margin-top: 0.25rem;
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <div class="badge-date">採訪日期：2026 / 08 / 25</div>
      <h1>高鐵策略合作記者會 相關新聞彙整</h1>
      <p>點選任一新聞卡片將直接前往媒體報導（可使用瀏覽器上一頁返回）</p>
    </header>

    <!-- 新聞卡片列表 -->
    <div class="news-list" id="newsList"></div>
  </div>

  <script>
    // 完整 10 則新聞資料
    const newsData = [
      {
        id: 1,
        media: "中央社",
        reporter: "張建中",
        title: "國際半導體展9月2日登場迎10萬訪客 高鐵5站領證串聯科技聚落",
        url: "https://money.udn.com/money/story/5612/9713425"
      },
      {
        id: 2,
        media: "中央社",
        reporter: "張建中",
        title: "帆宣：台灣產業加速海外布局 明年營運可望優於今年",
        url: "https://www.cna.com.tw/news/afe/202608250237.aspx"
      },
      {
        id: 3,
        media: "中國時報",
        reporter: "柳名耕",
        title: "打造矽島動脈 SEMICON攜手高鐵設立領證專櫃",
        url: "https://www.chinatimes.com/realtimenews/20260825002932-260410?chdtv"
      },
      {
        id: 4,
        media: "經濟日報",
        reporter: "朱子呈",
        title: "SEMICON Taiwan攜手高鐵 展期加密班次、五大站可現場領證",
        url: "https://udn.com/news/amp/story/7240/9712941"
      },
      {
        id: 5,
        media: "自由時報",
        reporter: "林薏茹",
        title: "SEMICON Taiwan攜手台灣高鐵 五大站點領證、展期加密班次迎10萬人",
        url: "https://ec.ltn.com.tw/article/breakingnews/5551601"
      },
      {
        id: 6,
        media: "聯合報",
        reporter: "胡經周",
        title: "半導體產業協會攜手台灣高鐵 宣布半導體與交通設施跨域合作",
        url: "https://udn.com/news/story/7266/9713523?from=udn-ch1_breaknews-1-99-news"
      },
      {
        id: 7,
        media: "新唐人",
        reporter: "",
        title: "美日韓擴建半導體聚落 台獨有生態系成全球典範",
        url: "https://www.ntdtv.com.tw/b5/20260825/video/410787.html?%E7%BE%8E%E6%97%A5%E9%9F%93%E6%93%B4%E5%BB%BA%E5%8D%8A%E5%B0%8E%E9%AB%94%E8%81%9A%E8%90%BD%20%E5%8F%B0%E7%8D%A8%E6%9C%89%E7%94%9F%E6%85%8B%E7%B3%BB%E6%88%90%E5%85%A8%E7%90%83%E5%85%B8%E7%AF%84"
      },
      {
        id: 8,
        media: "知新聞",
        reporter: "克里夫",
        title: "SEMICON Taiwan宣布攜手台灣高鐵串聯矽島動脈 共構半導體產業未來",
        url: "https://www.knews.com.tw/news/1A2BB4F269C10671580AD62B6D0DA604"
      },
      {
        id: 9,
        media: "知新聞",
        reporter: "",
        title: "串聯台灣半導體55兆產值！高鐵成矽島神經脈絡 敵人也換了",
        url: "https://www.knews.com.tw/news/EAB03A9E94DF9ACBC1D92071F0523271"
      }
    ];

    const newsList = document.getElementById('newsList');

    // 渲染新聞卡片
    function renderNews(data) {
      newsList.innerHTML = '';
      data.forEach(item => {
        const card = document.createElement('a');
        card.className = 'news-card';
        card.href = item.url;
        
        // 若有記者才顯示記者姓名
        const reporterHtml = item.reporter ? `<span class="reporter-name">記者：${item.reporter}</span>` : '';

        card.innerHTML = `
          <div class="card-meta">
            <span class="media-tag">${item.media}</span>
            ${reporterHtml}
          </div>
          <h3 class="news-title">${item.title}</h3>
          <div class="card-footer">前往閱讀原文網頁 ➔</div>
        `;
        newsList.appendChild(card);
      });
    }

    // 初始載入
    renderNews(newsData);
  </script>
</body>
</html>
